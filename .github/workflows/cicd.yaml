name: Build and Push Docker Image

on:
    push:
        branches:
            - main
            - stage
            - develop

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            # CI
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'yarn'

            - name: Install Dependencies
              run: yarn install --frozen-lockfile

            - name: Build Project
              run: yarn run build

            # CD
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ secrets.DOCKER_USERNAME }}/msa-fe:${{ github.sha }}

            - name: Set Environment Name
              run: |
                  if [[ "${{ github.ref_name }}" == "main" ]]; then
                    echo "ENV=production" >> $GITHUB_ENV
                  elif [[ "${{ github.ref_name }}" == "stage" ]]; then
                    echo "ENV=stage" >> $GITHUB_ENV
                  else
                    echo "ENV=dev" >> $GITHUB_ENV
                  fi

            - name: Setup Kustomize
              uses: imranismail/setup-kustomize@v2

            - name: Update Kubernetes resources
              run: |
                  git config --global user.name "GitHub Action"
                  git config --global user.email "action@github.com"
                  git clone https://x-access-token:${{ secrets.MY_TOKEN }}@github.com/nghia2742/msa-config.git
                  cd msa-config/k8s/msa-fe/overlays/${{ env.ENV }}
                  kustomize edit set image nghia2742/msa-fe=nghia2742/msa-fe:${{ github.sha }}
                  git add .
                  git commit -m "FE: Update ${{ env.ENV }} image tag to ${{ github.sha }}"
                  git push https://x-access-token:${{ secrets.MY_TOKEN }}@github.com/nghia2742/msa-config.git main
